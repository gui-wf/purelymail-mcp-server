name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for npm Trusted Publisher

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 24 ships npm >= 11.5.1 needed for trusted publishing
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Check npm for trusted publishing
        run: |
          node -v
          npm -v
          node -e "const [maj,min]=process.versions.node.split('.').map(Number); if(maj<24) process.exit(1)"
          node -e "const [maj,min]=require('child_process').execSync('npm -v').toString().trim().split('.').map(Number); if(maj<11||(maj===11&&min<5)) { console.error('need npm >= 11.5.1'); process.exit(1) }"

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Run tests
        run: MOCK_MODE=true npm test

      - name: Publish to npm
        # Auth via GitHub OIDC + npm Trusted Publisher (no NODE_AUTH_TOKEN).
        # Provenance is attached automatically with trusted publishing.
        run: npm publish --access public

      - name: Publish summary
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          {
            echo "## Published to npm"
            echo ""
            echo "- **Version**: $VERSION"
            echo "- **Package**: [purelymail-mcp-server](https://www.npmjs.com/package/purelymail-mcp-server)"
            echo "- **Tag**: ${{ github.ref_name }}"
            echo "- **Auth**: GitHub OIDC Trusted Publisher"
          } >> "$GITHUB_STEP_SUMMARY"
